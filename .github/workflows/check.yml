name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Lessons run
        run: make lessons
      - name: Checkers run (exit 0 even when exercises are unsolved)
        run: make check
      - name: Tests
        run: python3 -m pytest stages projects -q
